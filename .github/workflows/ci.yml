name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit (PHP 8.5 / PostgreSQL 15)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to PostgreSQL 15 to match the Sakura Cloud PostgreSQL
        # Appliance used in production. See
        # docs/adr/0004-postgresql-15-standardization.md.
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wildlive_test
          POSTGRES_USER: wildlive
          POSTGRES_PASSWORD: wildlive_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wildlive -d wildlive_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: wildlive_test
      DB_USERNAME: wildlive
      DB_PASSWORD: wildlive_ci_only

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_pgsql, pgsql, intl, zip, bcmath, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U wildlive; then exit 0; fi
            sleep 1
          done
          echo "postgres did not become ready" >&2
          exit 1

      - name: Run migrations (primary DB)
        run: php artisan migrate --force

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
