name: Feature
description: Propose a scoped WildLive feature
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What player or engineering outcome is required?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define observable completion conditions.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Initial risk
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
